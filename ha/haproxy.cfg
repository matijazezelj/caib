global
  maxconn 512

defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m

# Containers can change IP across restarts; re-resolve via Docker's DNS so a
# restarted node comes back into rotation (spec's static config would pin the
# first-seen IP forever).
resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

# init-state down: a server gets no traffic until `rise` checks pass. The
# default starts every server UP until `fall` checks fail, so for ~9s after
# HAProxy (re)starts, :5000 hands out replicas too — `make ha-up` over an
# existing cluster then failed intermittently in migrate with "cannot execute
# GRANT in a read-only transaction" (reproduced on 3.2 and 3.4).
listen primary
  bind *:5000
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-state down
  server pg1 spilo1:5432 check port 8008 resolvers docker init-addr libc,none
  server pg2 spilo2:5432 check port 8008 resolvers docker init-addr libc,none
  server pg3 spilo3:5432 check port 8008 resolvers docker init-addr libc,none

listen readonly
  bind *:5001
  option httpchk GET /read-only        # matches replicas AND the primary:
  http-check expect status 200         # Grafana stays up when replicas are down
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-state down
  server pg1 spilo1:5432 check port 8008 resolvers docker init-addr libc,none
  server pg2 spilo2:5432 check port 8008 resolvers docker init-addr libc,none
  server pg3 spilo3:5432 check port 8008 resolvers docker init-addr libc,none

listen stats
  bind *:7000
  mode http
  stats enable
  stats uri /
