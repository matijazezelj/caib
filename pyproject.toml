[project]
name = "caib"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["caib-core", "caib-pollers"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "pollers"]

[tool.uv.sources]
caib-core = { workspace = true }
caib-pollers = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
