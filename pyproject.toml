[project]
name = "caib"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["caib-core", "caib-pollers", "caib-agentapi"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "pyyaml>=6",
    "boto3>=1.44.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "pollers", "agentapi"]

[tool.uv.sources]
caib-core = { workspace = true }
caib-pollers = { workspace = true }
caib-agentapi = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy integration tests (localstack etc.)"]
