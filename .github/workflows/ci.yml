name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs: setup-uv stopped publishing floating
      # major/minor tags at v8, and a SHA is the only ref a tag cannot be
      # moved out from under. Bump the SHA and the trailing comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Must be the TSL build; the license test below is the gate.
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: caib
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CAIB_TEST_PG_URL: postgresql://postgres:ci@localhost:5432/caib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync
      - run: uv run pytest -q

  # Runs alongside `test`: nothing here needs the database, and a broken
  # Dockerfile or compose file used to reach main untouched by CI.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image pins are tagged and agree with each other
        run: bash scripts/check_image_pins.sh

      # Build only — nothing is pushed, and nothing here has a registry to
      # push to. The tags exist so a failure names the image that broke.
      - name: Build caib-core
        run: docker build -f core/Dockerfile -t caib-core:ci .
      - name: Build caib-poller
        run: docker build -f pollers/Dockerfile -t caib-poller:ci .
      - name: Build caib-agent-api
        run: docker build -f agentapi/Dockerfile -t caib-agent-api:ci .
      # Context is ./backup, matching compose.backup.yml.
      - name: Build caib-timescaledb-backup
        run: docker build -t caib-timescaledb-backup:ci ./backup

      # Every `${VAR:?}` in the compose files has to resolve or `config` fails,
      # so generate the same .env a first run would get.
      - name: Generate .env
        run: bash scripts/init_env.sh

      # `--profile '*'` pulls the per-module services (pollers, vector) into
      # the render; without it they are silently skipped and never validated.
      - name: Validate the compose files
        run: |
          set -eux
          docker compose --profile '*' -f docker-compose.yml config -q
          for overlay in compose.*.yml; do
            docker compose --profile '*' -f docker-compose.yml -f "$overlay" config -q
          done
