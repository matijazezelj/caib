name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs: setup-uv stopped publishing floating
      # major/minor tags at v8, and a SHA is the only ref a tag cannot be
      # moved out from under. Bump the SHA and the trailing comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        # Must be the TSL build; the license test below is the gate.
        image: timescale/timescaledb:2.29.2-pg18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: caib
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CAIB_TEST_PG_URL: postgresql://postgres:ci@localhost:5432/caib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync
      - run: uv run pytest -q
