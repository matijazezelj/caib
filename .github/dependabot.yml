version: 2

updates:
  # The workflow `uses:` refs. They are pinned to commit SHAs, which dependabot
  # understands: it rewrites the SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # One entry per directory holding a Dockerfile. The `docker` ecosystem only
  # looks at Dockerfile/Containerfile names, so compose files need their own
  # entry below (see `docker-compose`).
  - package-ecosystem: docker
    directories:
      - /core
      - /pollers
      - /backup
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  # The six pinned stack images live in the compose files, not in Dockerfiles.
  # Dependabot's docker-compose fetcher matches
  # /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i, which covers all four of
  # docker-compose.yml, compose.backup.yml, compose.ha.yml, compose.render.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    ignore:
      # Locally built images (`build:` + a `:dev` tag); there is no registry to
      # check them against.
      - dependency-name: caib-core
      - dependency-name: caib-poller
      - dependency-name: caib-timescaledb-backup

  # Python workspace: the root uv.lock covers root + core/ + pollers/.
  # Minor and patch land as one PR; majors stay separate so they get read.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
