# Default: local posix repo on the backrest_repo volume — self-contained, used
# by `make restore-test`. For real deployments switch repo1 to S3/MinIO; see
# docs/BACKUPS.md for the S3 stanza.
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
process-max=2
log-level-console=info

[caib]
pg1-path=/var/lib/postgresql/18/docker
