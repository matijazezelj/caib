# An admin switched 2-step verification enforcement (or availability) off for
# the domain or an OU — every account there goes back to password-only.
# Based on SigmaHQ 780601d1-6376-4f2a-884e-b8d45599f78c "Google Workspace MFA
# Disabled" by Austin Songer
# (https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/gcp/gworkspace/admin/gcp_gworkspace_mfa_disabled.yml),
# Detection Rule License 1.1. Ours raises the level to high.
id: google_workspace.two_step_verification_disabled
enabled: true
module: google_workspace
title: "Google Workspace 2-step verification enforcement disabled"
severity: high
interval: 60
lookback: 15m
sql: |
  SELECT
    coalesce(actor, '-') || '|' || action || '|' || coalesce(attrs->>'org_unit', '-') AS dedup_key,
    jsonb_build_object('actor', actor, 'setting', action,
                       'org_unit', attrs->>'org_unit')        AS entity,
    jsonb_build_object('events', count(*)::int)               AS context,
    max(event_time)                                           AS last_event_time
  FROM caib.events
  WHERE module = 'google_workspace'
    AND ingested_at > %(wm_from)s AND ingested_at <= %(wm_to)s
    AND attrs->>'application' = 'admin'
    AND action IN ('ENFORCE_STRONG_AUTHENTICATION', 'ALLOW_STRONG_AUTHENTICATION')
    AND lower(attrs->>'new_value') = 'false'
  GROUP BY actor, action, attrs->>'org_unit'
