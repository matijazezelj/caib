# CAIB's own rule: an AWS console sign-in attempt (ConsoleLogin, any outcome) by
# the account root user. Not derived from Sigma. Related upstream rule, which is
# broader (any root activity except AwsServiceEvent): SigmaHQ "AWS Root
# Credentials", id 8ad1600d-e9dc-4251-b0ee-a65268f29add, author vitaliy0x1,
# https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_root_account_usage.yml
# (Detection Rule License 1.1).
id: aws_cloudtrail.root_console_login
enabled: true
module: aws_cloudtrail
title: "Root account console login"
severity: high
interval: 60
lookback: 15m
notify_recurrence: false
sql: |
  SELECT
    actor || '|' || coalesce(host(src_ip), '-')  AS dedup_key,
    jsonb_build_object('actor', actor, 'src_ip', host(src_ip)) AS entity,
    jsonb_build_object('events', count(*)::int)  AS context,
    max(event_time)                              AS last_event_time
  FROM caib.events
  WHERE module = 'aws_cloudtrail'
    AND ingested_at > %(wm_from)s AND ingested_at <= %(wm_to)s
    AND action = 'ConsoleLogin'
    AND attrs->>'user_type' = 'Root'
  GROUP BY actor, src_ip
