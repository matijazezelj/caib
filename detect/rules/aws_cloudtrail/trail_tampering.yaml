# CAIB's own rule: CloudTrail logging stopped, a trail deleted, or its event
# selectors changed (StopLogging / DeleteTrail / PutEventSelectors). Not derived
# from Sigma. Related upstream rule, which matches StopLogging / UpdateTrail /
# DeleteTrail: SigmaHQ "AWS CloudTrail Important Change", id
# 4db60cc0-36fb-42b7-9b58-a5b53019fb74, author vitaliy0x1,
# https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_cloudtrail_disable_logging.yml
# (Detection Rule License 1.1).
id: aws_cloudtrail.trail_tampering
enabled: true
module: aws_cloudtrail
title: "CloudTrail logging tampered with"
severity: critical
interval: 60
lookback: 15m
sql: |
  SELECT
    coalesce(actor, '-') || '|' || action        AS dedup_key,
    jsonb_build_object('actor', actor, 'action', action) AS entity,
    jsonb_build_object('events', count(*)::int,
                       'regions', jsonb_agg(DISTINCT attrs->>'aws_region')) AS context,
    max(event_time)                              AS last_event_time
  FROM caib.events
  WHERE module = 'aws_cloudtrail'
    AND ingested_at > %(wm_from)s AND ingested_at <= %(wm_to)s
    AND action IN ('StopLogging', 'DeleteTrail', 'PutEventSelectors')
  GROUP BY actor, action
