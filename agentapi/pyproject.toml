[project]
name = "caib-agentapi"
version = "0.1.0"
description = "CAIB agent query layer: read-only HTTP/JSON API and MCP server over caib_core.query"
requires-python = ">=3.12"
dependencies = [
    "caib-core",
    # [pool] pulls psycopg_pool; both transports hold a small pool rather than
    # reconnecting per request.
    "psycopg[binary,pool]>=3.3.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 2.x, not 1.x: this uses MCPServer, Tool.input_schema and
    # mcp.server.mcpserver.exceptions.ToolError, none of which exist in 1.x.
    "mcp>=2.2.0",
]

[project.scripts]
caib-agent-api = "caib_agentapi.app:main"
caib-agent-mcp = "caib_agentapi.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caib_agentapi"]
