name: caib

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - default_toast_compression=lz4
      - -c
      - timezone=UTC
    environment:
      POSTGRES_PASSWORD: ${CAIB_PG_SUPERPASS:?set in .env}
      POSTGRES_DB: caib
    volumes:
      # pg18 images keep PGDATA under /var/lib/postgresql/<major>/; mounting the
      # parent covers both old and new layouts.
      - pgdata:/var/lib/postgresql
    ports:
      - "${CAIB_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caib"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: caib-core:dev
    command: ["migrate"]
    environment:
      CAIB_PG_SUPER_URL: postgresql://postgres:${CAIB_PG_SUPERPASS}@timescaledb:5432/caib
      CAIB_PG_APP_PASSWORD: ${CAIB_PG_APP_PASSWORD:?set in .env}
      CAIB_PG_RO_PASSWORD: ${CAIB_PG_RO_PASSWORD:?set in .env}
    volumes:
      - ./db/migrations:/app/db/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  grafana:
    image: grafana/grafana:12.4.9
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${CAIB_GRAFANA_ADMIN_PASSWORD:-admin}
      CAIB_PG_RO_PASSWORD: ${CAIB_PG_RO_PASSWORD:?set in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${CAIB_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
