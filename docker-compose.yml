name: caib

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - default_toast_compression=lz4
      - -c
      - timezone=UTC
    environment:
      POSTGRES_PASSWORD: ${CAIB_PG_SUPERPASS:?set in .env}
      POSTGRES_DB: caib
    volumes:
      # pg18 images keep PGDATA under /var/lib/postgresql/<major>/; mounting the
      # parent covers both old and new layouts.
      - pgdata:/var/lib/postgresql
    ports:
      - "${CAIB_BIND_ADDR:-127.0.0.1}:${CAIB_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caib"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: caib-core:dev
    command: ["migrate"]
    environment:
      CAIB_PG_SUPER_URL: postgresql://postgres:${CAIB_PG_SUPERPASS}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_PG_APP_PASSWORD: ${CAIB_PG_APP_PASSWORD:?set in .env}
      CAIB_PG_RO_PASSWORD: ${CAIB_PG_RO_PASSWORD:?set in .env}
      # migrate is what sets caib_agent_ro's password (sync_passwords). Without
      # this line the role was created password-less and the agent-api service
      # could never log in. `:-`, not `:?`: the agent layer is opt-in, and an
      # .env from before it must still start the core stack.
      CAIB_AGENT_RO_PASSWORD: ${CAIB_AGENT_RO_PASSWORD:-}
    volumes:
      - ./db/migrations:/app/db/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  loader:
    image: caib-core:dev
    build:
      context: .
      dockerfile: core/Dockerfile
    command: ["loader"]
    environment:
      CAIB_PG_URL: postgresql://caib_app:${CAIB_PG_APP_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_LOADER_BATCH: ${CAIB_LOADER_BATCH:-5000}
      CAIB_LOADER_INTERVAL_S: ${CAIB_LOADER_INTERVAL_S:-5}
      CAIB_DROP_RAW: ${CAIB_DROP_RAW:-false}
    healthcheck:
      test: ["CMD", "caib-core", "healthcheck", "--service", "loader", "--max-age", "120"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  detect:
    image: caib-core:dev
    build:
      context: .
      dockerfile: core/Dockerfile
    command: ["detect"]
    environment:
      CAIB_PG_URL: postgresql://caib_app:${CAIB_PG_APP_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_DETECT_SAFETY_LAG: ${CAIB_DETECT_SAFETY_LAG:-60}
      CAIB_DETECT_MAX_ALERTS_PER_TICK: ${CAIB_DETECT_MAX_ALERTS_PER_TICK:-500}
      CAIB_DETECT_OVERFLOW_NOTIFY_INTERVAL: ${CAIB_DETECT_OVERFLOW_NOTIFY_INTERVAL:-3600}
      CAIB_NOTIFY_WEBHOOK_URL: ${CAIB_NOTIFY_WEBHOOK_URL:-}
      CAIB_NOTIFY_MIN_SEVERITY: ${CAIB_NOTIFY_MIN_SEVERITY:-info}
      # Blank = auto-detect from the webhook URL (see caib_core.notify).
      CAIB_NOTIFY_FORMAT: ${CAIB_NOTIFY_FORMAT:-}
      CAIB_RETENTION_OUTBOX_DAYS: ${CAIB_RETENTION_OUTBOX_DAYS:-30}
      CAIB_RETENTION_ALERTS_CLOSED_DAYS: ${CAIB_RETENTION_ALERTS_CLOSED_DAYS:-90}
      CAIB_RETENTION_DEAD_LETTER_DAYS: ${CAIB_RETENTION_DEAD_LETTER_DAYS:-30}
    healthcheck:
      test: ["CMD", "caib-core", "healthcheck", "--service", "detect", "--max-age", "120"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./detect/rules:/app/detect/rules:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  poller-cloudflare-audit:
    image: caib-poller:dev
    build:
      context: .
      dockerfile: pollers/Dockerfile
    profiles: ["cloudflare_audit"]
    environment:
      CAIB_MODULE: cloudflare_audit
      CAIB_PG_URL: postgresql://caib_app:${CAIB_PG_APP_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_CLOUDFLARE_API_TOKEN: ${CAIB_CLOUDFLARE_API_TOKEN:-}
      CAIB_CLOUDFLARE_ACCOUNT_ID: ${CAIB_CLOUDFLARE_ACCOUNT_ID:-}
      CAIB_CLOUDFLARE_AUDIT_BACKFILL: ${CAIB_CLOUDFLARE_AUDIT_BACKFILL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  poller-azure-activity:
    image: caib-poller:dev
    build:
      context: .
      dockerfile: pollers/Dockerfile
    profiles: ["azure_activity"]
    environment:
      CAIB_MODULE: azure_activity
      CAIB_PG_URL: postgresql://caib_app:${CAIB_PG_APP_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_AZURE_TENANT_ID: ${CAIB_AZURE_TENANT_ID:-}
      CAIB_AZURE_CLIENT_ID: ${CAIB_AZURE_CLIENT_ID:-}
      CAIB_AZURE_CLIENT_SECRET: ${CAIB_AZURE_CLIENT_SECRET:-}
      CAIB_AZURE_SUBSCRIPTION_ID: ${CAIB_AZURE_SUBSCRIPTION_ID:-}
      CAIB_AZURE_ACTIVITY_BACKFILL: ${CAIB_AZURE_ACTIVITY_BACKFILL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  vector-aws-cloudtrail:
    image: timberio/vector:0.57.0-debian
    profiles: ["aws_cloudtrail"]
    command:
      - --config
      - /etc/vector/vector.yaml
      - --config
      - /etc/vector/modules/aws_cloudtrail.yaml
    environment:
      CAIB_PG_URL: postgresql://caib_app:${CAIB_PG_APP_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_CLOUDTRAIL_SQS_URL: ${CAIB_CLOUDTRAIL_SQS_URL:-}
      CAIB_AWS_REGION: ${CAIB_AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vector/modules/aws_cloudtrail.yaml:/etc/vector/modules/aws_cloudtrail.yaml:ro
      - vector_cloudtrail_data:/var/lib/vector
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  vector-gcp-audit:
    image: timberio/vector:0.57.0-debian
    profiles: ["gcp_audit"]
    command:
      - --config
      - /etc/vector/vector.yaml
      - --config
      - /etc/vector/modules/gcp_audit.yaml
    environment:
      CAIB_PG_URL: postgresql://caib_app:${CAIB_PG_APP_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      CAIB_GCP_PROJECT: ${CAIB_GCP_PROJECT:-}
      CAIB_GCP_SUBSCRIPTION: ${CAIB_GCP_SUBSCRIPTION:-}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vector/modules/gcp_audit.yaml:/etc/vector/modules/gcp_audit.yaml:ro
      - ${CAIB_GCP_CREDENTIALS_FILE:-/dev/null}:/gcp/credentials.json:ro
      - vector_gcp_data:/var/lib/vector
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Read-only query surface for agents (docs/AGENT_API.md). Off unless asked
  # for: `docker compose --profile agent-api up -d`.
  agent-api:
    image: caib-agent-api:dev
    build:
      context: .
      dockerfile: agentapi/Dockerfile
    profiles: ["agent-api"]
    environment:
      # caib_agent_ro, NOT caib_app and NOT caib_ro. Read-only is a property of
      # this role — SELECT on five tables, no write privilege, a 15s
      # statement_timeout — not of the code in front of it.
      CAIB_RO_PG_URL: postgresql://caib_agent_ro:${CAIB_AGENT_RO_PASSWORD}@timescaledb:5432/caib?sslmode=${CAIB_PG_SSLMODE:-prefer}
      # An unset or empty token must fail the service, not open it — and it
      # does: Settings.from_env refuses to start. Not `:?` here, because compose
      # interpolates every service whether or not its profile is enabled, so a
      # `:?` on this variable broke `make up` for every .env created before the
      # agent layer existed (tests/test_compose_env.py).
      CAIB_AGENT_API_TOKEN: ${CAIB_AGENT_API_TOKEN:-}
      # Browser Origins allowed to call /v1 and /mcp; any other Origin gets 403.
      CAIB_AGENT_ALLOWED_ORIGINS: ${CAIB_AGENT_ALLOWED_ORIGINS:-}
      # 0.0.0.0 is the container's own namespace, not exposure — the published
      # port below is what decides who can reach this, and it binds to
      # CAIB_BIND_ADDR (loopback by default), same as Postgres and Grafana.
      # Running the binary outside a container defaults to 127.0.0.1.
      CAIB_AGENT_API_BIND: 0.0.0.0
      CAIB_AGENT_API_PORT: 8088
    ports:
      - "${CAIB_BIND_ADDR:-127.0.0.1}:${CAIB_AGENT_API_PORT:-8088}:8088"
    volumes:
      - ./detect/rules:/app/detect/rules:ro
    healthcheck:
      test: ["CMD", "caib-agent-api", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.9
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${CAIB_GRAFANA_ADMIN_PASSWORD:?set in .env}
      CAIB_PG_RO_PASSWORD: ${CAIB_PG_RO_PASSWORD:?set in .env}
      CAIB_GRAFANA_DS_URL: ${CAIB_GRAFANA_DS_URL:-timescaledb:5432}
      CAIB_PG_SSLMODE: ${CAIB_PG_SSLMODE:-prefer}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${CAIB_BIND_ADDR:-127.0.0.1}:${CAIB_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  grafana_data:
  vector_cloudtrail_data:
  vector_gcp_data:
