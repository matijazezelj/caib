apiVersion: 1

datasources:
  - name: caib
    uid: caib
    type: grafana-postgresql-datasource
    access: proxy
    url: $__env{CAIB_GRAFANA_DS_URL}
    user: caib_ro
    isDefault: true
    editable: false
    jsonData:
      database: caib
      # Was hardcoded to disable, which no deployment could change without
      # editing this tracked file. Default matches the app connections.
      sslmode: $__env{CAIB_PG_SSLMODE}
      timescaledb: true
    secureJsonData:
      password: $__env{CAIB_PG_RO_PASSWORD}
