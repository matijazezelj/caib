[project]
name = "caib-pollers"
version = "0.1.0"
description = "CAIB pollers: one image, CAIB_MODULE selects the module"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "httpx>=0.27",
]

[project.scripts]
caib-poller = "caib_pollers.framework:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
